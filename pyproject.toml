[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-mercedes"
version = "0.1.0"
description = "Mercedes-Benz state of charge as an Omarchy/Waybar module (read-only, no Home Assistant)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hendkai" }]
keywords = ["waybar", "omarchy", "mercedes", "soc", "ev"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.28",
    "protobuf>=4.25",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest"]

[project.scripts]
omarchy-mercedes = "omarchy_mercedes.cli:main"
omarchy-mercedes-waybar = "omarchy_mercedes.waybar_module:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["omarchy_mercedes*"]

[tool.setuptools.package-data]
omarchy_mercedes = ["vendored/*.py"]
